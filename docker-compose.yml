services:
  mirakurun:
#    image: mh/mirakurun:3.9.0-rc4
    image: mh/mirakurun:4.0.0-beta16
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    ports:
      - "40772:40772"
      - "9229:9229"
    volumes:
      - ./mirakurun/conf:/app-config
      - ./mirakurun/data:/app-data
    environment:
      TZ: "Asia/Tokyo"
    devices:
      - /dev/bus:/dev/bus
      - /dev/dvb:/dev/dvb
      - /dev/pxmlt5video0:/dev/pxmlt5video0
      - /dev/pxmlt5video1:/dev/pxmlt5video1
      - /dev/pxmlt5video2:/dev/pxmlt5video2
      - /dev/pxmlt5video3:/dev/pxmlt5video3
      - /dev/pxmlt5video4:/dev/pxmlt5video4
    restart: always
    logging:
      driver: json-file
      options:
        max-file: "1"
        max-size: 10m
    networks:
      - dlan

  mysql:
    image: mariadb:10.5
    volumes:
      - mysql-db:/var/lib/mysql
    environment:
      MYSQL_USER: epgstation
      MYSQL_PASSWORD: epgstation
      MYSQL_ROOT_PASSWORD: epgstation
      MYSQL_DATABASE: epgstation
      TZ: "Asia/Tokyo"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --performance-schema=false --expire_logs_days=1
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dlan

  epgstation:
    image: mh/epgstation:2.10.0
#    runtime: nvidia
    volumes:
      - ./epgstation/config:/app/config
      - ./epgstation/data:/app/data
      - ./epgstation/thumbnail:/app/thumbnail
      - ./epgstation/logs:/app/logs
      - /home/michaelhsu/Storage/tv_live/recorded:/app/recorded
    environment:
      TZ: "Asia/Tokyo"
#      NVIDIA_VISIBLE_DEVICES: all
#      NVIDIA_DRIVER_CAPABILITIES: all
    depends_on:
      - mirakurun
      - mysql
    ports:
      - "8888:8888"
      - "8889:8889"
    user: "1000:1000"
#     devices:
#       - /dev/dri:/dev/dri
    restart: always
    networks:
      - dlan

volumes:
  mysql-db:
    driver: local

networks:
  dlan:
    name: docker-lan
    external: true
