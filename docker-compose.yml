services:
  mirakurun:
    image: mh/mirakurun:${MIRAKURUN_VERSION:?run launch.sh build first (no .env found)}
    pull_policy: never   # built by launch.sh build; never fetch a Docker Hub image of the same name
    build:
      context: ../srcs/Mirakurun
      dockerfile: docker/Dockerfile
    # Mirakurun saves its pending program changes on stop (up to 25 s, see src/server.ts); docker's 10 s default
    # could cut a save off on the busy disk
    stop_grace_period: 30s
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    # Only the API port: the debugger port 9229 (debug mode only) has no password and is reached through an SSH
    # tunnel instead (tv_live/setup.txt)
    ports:
      - "40772:40772"
    volumes:
      - ./mirakurun/conf:/app-config
      - ./mirakurun/data:/app-data
    environment:
      TZ: "Asia/Tokyo"
      # skip container-init.sh's npm install of arib-b25-stream-test on every start: only the disabled
      # tuners (adapter0-4) use it; remove this before enabling them (tv_live/setup.txt)
      DISABLE_B25_TEST: "1"
    devices:
      - /dev/bus:/dev/bus
      - /dev/dvb:/dev/dvb
      - /dev/pxmlt5video0:/dev/pxmlt5video0
      - /dev/pxmlt5video1:/dev/pxmlt5video1
      - /dev/pxmlt5video2:/dev/pxmlt5video2
      - /dev/pxmlt5video3:/dev/pxmlt5video3
      - /dev/pxmlt5video4:/dev/pxmlt5video4
    restart: always
    logging:
      driver: json-file
      options:
        # about 1 MB a day: 20 files keep about half a year (logrotate/entrypoint.sh's retention rule);
        # the log is lost when the container is recreated
        max-size: "10m"
        max-file: "20"
    # Only the TV network: the containers on docker-lan (the internet-facing website among them)
    # cannot reach its API, which has no login and runs commands as root. Its published ports
    # (above) still serve the LAN.
    networks:
      - tv

  mysql:
    # MariaDB LTS (12.3: supported until 2029). A new major version upgrades the data files on
    # its first start (MARIADB_AUTO_UPGRADE); take a dump first (setup.txt, "database backup").
    image: mariadb:12.3
    # its shutdown (flushing dirty pages to the slow HDD) can take over docker's 10 s default; a SIGKILL then
    # means crash recovery on the next start. 60 s stays within systemd's 90 s stop timeout for docker.service
    stop_grace_period: 60s
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      MYSQL_USER: epgstation
      MYSQL_PASSWORD: epgstation
      MYSQL_ROOT_PASSWORD: epgstation
      MYSQL_DATABASE: epgstation
      MARIADB_AUTO_UPGRADE: "1"
      TZ: "Asia/Tokyo"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --performance-schema=false --expire_logs_days=1
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    # Only EPGStation uses it: the TV network alone
    networks:
      - tv

  epgstation:
    image: mh/epgstation:${EPGSTATION_VERSION:?run launch.sh build first (no .env found)}
    pull_policy: never   # built by launch.sh build; never fetch a Docker Hub image of the same name
    build:
      context: ../srcs/EPGStation
      dockerfile: docker/Dockerfile
      additional_contexts:
        ffmpegsrc: ../srcs/ffmpeg
        cuda: ./cuda   # the CUDA installer, linked here by launch.sh build (kept out of the main context)
    runtime: nvidia
    volumes:
      - ./epgstation/config:/app/config
      - ./epgstation/scripts:/app/scripts
      - ./epgstation/data:/app/data
      - ./epgstation/thumbnail:/app/thumbnail
      - ./epgstation/drop:/app/drop   # drop check logs (isEnabledDropCheck), one per recording
      - ./epgstation/logs:/app/logs
      - /home/michaelhsu/Storage/tv_live/recorded:/app/recorded
    environment:
      TZ: "Asia/Tokyo"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    depends_on:
      - mirakurun
      - mysql
    ports:
      - "8888:8888"
    user: "1000:1000"
#     devices:
#       - /dev/dri:/dev/dri
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    # The TV network for Mirakurun and MariaDB; docker-lan for the website (its EPG pages, EPGSTATION_URL)
    # and Apache's tv site, which reach it as docker-mirakurun-epgstation-epgstation-1:8888
    networks:
      - tv
      - dlan

  # Rotation/retention for EPGStation's Service/Operator/EPGUpdater logs - see
  # logrotate.d/tv_live.logrotate for the policy. log4js's own maxLogSize/backups rotation
  # is disabled in the *LogConfig.yml files in favor of this central policy.
  logrotate:
    image: logrotate-sidecar:latest   # built by ../../logrotate/launch.sh, not here
    pull_policy: never
    container_name: tv-live-logrotate
    environment:
      - TZ=Asia/Tokyo
    restart: always
    volumes:
      - ./epgstation/logs:/app/logs
      - ./logrotate.d:/etc/logrotate-src:ro
      - ./epgstation/logs/.logrotate-state:/var/lib/logrotate
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tv

networks:
  dlan:
    name: docker-lan
    external: true
  # The TV stack's own network (MachineSetup/NETWORK.md). A plain bridge, not internal: Docker publishes no
  # port of a container that is only on an internal network, and Mirakurun's 40772 is opened from the LAN.
  tv:
    name: tv-internal
    driver_opts:
      com.docker.network.bridge.name: br-tv-internal
    # Containers get addresses from 172.19.1.0/24 only, apart from the gateway 172.19.0.1: Docker rewrites the source
    # of a request reaching Mirakurun's published port from docker-lan (or from this host) to that gateway, so
    # Mirakurun's allow-list (mirakurun/conf/server.yml, allowIPv4CidrRanges) admits EPGStation and refuses those.
    ipam:
      config:
        - subnet: 172.19.0.0/16
          ip_range: 172.19.1.0/24
          gateway: 172.19.0.1
