port: 8888
mirakurunPath: http://mirakurun:40772/

# dbtype: sqlite
# sqlite:
#   extensions:
#     - '/hoge/regexp.dylib'
#   regexp: true

dbtype: mysql
mysql:
    host: mysql
    port: 3306
    user: epgstation
    password: epgstation
    database: epgstation

epgUpdateIntervalTime: 10

conflictPriority: 1
recPriority: 2

recordedFormat: '%YEAR%年%MONTH%月%DAY%日%HOUR%時%MIN%分%SEC%秒-%CHNAME%-%TITLE%'
recordedFileExtension: .m2ts
recorded:
    - name: recorded
      path: '%ROOT%/recorded'

thumbnail: '%ROOT%/thumbnail'
thumbnailSize: 480x270
thumbnailPosition: 5

ffmpeg: /usr/local/bin/ffmpeg
ffprobe: /usr/local/bin/ffprobe

encodeProcessNum: 4
concurrentEncodeNum: 1
encode:
    - name: H.264
      cmd: '%NODE% %ROOT%/scripts/enc.js gpu'
      suffix: .mkv
      rate: 4.0

urlscheme:
    m2ts:
        ios: vlc-x-callback://x-callback-url/stream?url=PROTOCOL%3A%2F%2FADDRESS
        android: intent://ADDRESS#Intent;action=android.intent.action.VIEW;type=video/*;scheme=PROTOCOL;end
    video:
        ios: infuse://x-callback-url/play?url=PROTOCOL://ADDRESS
        android: intent://ADDRESS#Intent;action=android.intent.action.VIEW;type=video/*;scheme=PROTOCOL;end
    download:
        ios: vlc-x-callback://x-callback-url/download?url=PROTOCOL%3A%2F%2FADDRESS&filename=FILENAME

stream:
    live:
        ts:
            m2ts:
                - name: 720p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live m2ts 720p %FFMPEG%'
                - name: 480p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live m2ts 480p %FFMPEG%'
                - name: 無変換
                - name: 720p_low
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live m2ts 720p_low %FFMPEG%'

            m2tsll:
                - name: 720p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live m2tsll 720p %FFMPEG%'
                - name: 480p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live m2tsll 480p %FFMPEG%'

            webm:
                - name: 720p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live webm 720p %FFMPEG%'
                - name: 480p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live webm 480p %FFMPEG%'

            mp4:
                - name: 720p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live mp4 720p %FFMPEG%'
                - name: 480p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js live mp4 480p %FFMPEG%'

            hls:
                - name: 720p
                  cmd:
                      '%FFMPEG% -re -dual_mono_mode main -i pipe:0 -sn -map 0 -threads 0 -ignore_unknown
                      -max_muxing_queue_size 1024 -f hls -hls_time 3 -hls_list_size 17 -hls_allow_cache 1
                      -hls_segment_filename %streamFileDir%/stream%streamNum%-%09d.ts -hls_flags delete_segments -c:a
                      aac -ar 48000 -b:a 192k -ac 2 -c:v libx264 -vf yadif,scale=-2:720 -b:v 3000k -preset veryfast
                      -flags +loop-global_header %OUTPUT%'
                - name: 480p
                  cmd:
                      '%FFMPEG% -re -dual_mono_mode main -i pipe:0 -sn -map 0 -threads 0 -ignore_unknown
                      -max_muxing_queue_size 1024 -f hls -hls_time 3 -hls_list_size 17 -hls_allow_cache 1
                      -hls_segment_filename %streamFileDir%/stream%streamNum%-%09d.ts -hls_flags delete_segments -c:a
                      aac -ar 48000 -b:a 128k -ac 2 -c:v libx264 -vf yadif,scale=-2:480 -b:v 1500k -preset veryfast
                      -flags +loop-global_header %OUTPUT%'
    recorded:
        ts:
            webm:
                - name: 720p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js recorded webm 720p %FFMPEG%'
                - name: 480p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js recorded webm 480p %FFMPEG%'

            mp4:
                - name: 720p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js recorded mp4 720p %FFMPEG%'
                - name: 480p
                  cmd: '%NODE% %ROOT%/scripts/streamEncode.js recorded mp4 480p %FFMPEG%'

            hls:
                - name: 720p
                  cmd:
                      '%FFMPEG% -dual_mono_mode main -i pipe:0 -sn -map 0 -threads 0 -ignore_unknown
                      -max_muxing_queue_size 1024 -f hls -hls_time 3 -hls_list_size 0 -hls_allow_cache 1
                      -hls_segment_filename %streamFileDir%/stream%streamNum%-%09d.ts -hls_flags delete_segments -c:a
                      aac -ar 48000 -b:a 192k -ac 2 -c:v libx264 -vf yadif,scale=-2:720 -b:v 3000k -preset veryfast
                      -flags +loop-global_header %OUTPUT%'
                - name: 480p
                  cmd:
                      '%FFMPEG% -dual_mono_mode main -i pipe:0 -sn -map 0 -threads 0 -ignore_unknown
                      -max_muxing_queue_size 1024 -f hls -hls_time 3 -hls_list_size 0 -hls_allow_cache 1
                      -hls_segment_filename %streamFileDir%/stream%streamNum%-%09d.ts -hls_flags delete_segments -c:a
                      aac -ar 48000 -b:a 128k -ac 2 -c:v libx264 -vf yadif,scale=-2:480 -b:v 1500k -preset veryfast
                      -flags +loop-global_header %OUTPUT%'

        encoded:
            webm:
                - name: 720p
                  cmd:
                      '%FFMPEG% -dual_mono_mode main -ss %SS% -i %INPUT% -sn -threads 3 -c:a libvorbis -ar 48000 -b:a
                      192k -ac 2 -c:v libvpx-vp9 -vf scale=-2:720 -b:v 3000k -deadline realtime -speed 4 -cpu-used -8 -y
                      -f webm pipe:1'
                - name: 480p
                  cmd:
                      '%FFMPEG% -dual_mono_mode main -ss %SS% -i %INPUT% -sn -threads 3 -c:a libvorbis -ar 48000 -b:a
                      128k -ac 2 -c:v libvpx-vp9 -vf scale=-2:480 -b:v 1500k -deadline realtime -speed 4 -cpu-used -8 -y
                      -f webm pipe:1'

            mp4:
                - name: 720p
                  cmd:
                      #'%FFMPEG% -ss %SS% -i %INPUT% -map 0:v:0 -map 0:a:1 -sn -threads 0 -c:a aac -ar 48000 -b:a 192k -ac
                      #2 -c:v libx264 -vf scale=-2:720 -b:v 3000k -profile:v baseline -preset veryfast -tune
                      #fastdecode,zerolatency -movflags frag_keyframe+empty_moov+faststart+default_base_moof -y -f mp4
                      #pipe:1'
                      '%FFMPEG% -ss %SS% -hwaccel cuda -hwaccel_output_format cuda -i %INPUT% -map 0:v:0 -map 0:a:1 -sn
                      -threads 0 -c:a aac -ar 48000 -b:a 192k -ac 2 -c:v h264_nvenc -vf scale_cuda=-2:720 -b:v 3000k
                      -profile:v baseline -movflags frag_keyframe+empty_moov+faststart+default_base_moof -y -f mp4 pipe:1'
                - name: 480p
                  cmd:
                      #'%FFMPEG% -ss %SS% -i %INPUT% -map 0:v:0 -map 0:a:1 -sn -threads 0 -c:a aac -ar 48000 -b:a 128k -ac
                      #2 -c:v libx264 -vf scale=-2:480 -b:v 1500k -profile:v baseline -preset veryfast -tune
                      #fastdecode,zerolatency -movflags frag_keyframe+empty_moov+faststart+default_base_moof -y -f mp4
                      #pipe:1'
                      '%FFMPEG% -ss %SS% -hwaccel cuda -hwaccel_output_format cuda -i %INPUT% -map 0:v:0 -map 0:a:1 -sn
                      -threads 0 -c:a aac -ar 48000 -b:a 128k -ac 2 -c:v h264_nvenc -vf scale_cuda=-2:480 -b:v 1500k
                      -profile:v baseline -movflags frag_keyframe+empty_moov+faststart+default_base_moof -y -f mp4 pipe:1'

            hls:
                - name: 720p
                  cmd:
                      '%FFMPEG% -dual_mono_mode main -ss %SS% -i %INPUT% -sn -threads 0 -ignore_unknown
                      -max_muxing_queue_size 1024 -f hls -hls_time 3 -hls_list_size 0 -hls_allow_cache 1
                      -hls_segment_filename %streamFileDir%/stream%streamNum%-%09d.ts -hls_flags delete_segments -c:a
                      aac -ar 48000 -b:a 192k -ac 2 -c:v libx264 -vf scale=-2:720 -b:v 3000k -preset veryfast -flags
                      +loop-global_header %OUTPUT%'
                - name: 480p
                  cmd:
                      '%FFMPEG% -dual_mono_mode main -ss %SS% -i %INPUT% -sn -threads 0 -ignore_unknown
                      -max_muxing_queue_size 1024 -f hls -hls_time 3 -hls_list_size 0 -hls_allow_cache 1
                      -hls_segment_filename %streamFileDir%/stream%streamNum%-%09d.ts -hls_flags delete_segments -c:a
                      aac -ar 48000 -b:a 128k -ac 2 -c:v libx264 -vf scale=-2:480 -b:v 3000k -preset veryfast -flags
                      +loop-global_header %OUTPUT%'
