appenders:
  # maxLogSize/backups are commented out below on every file appender: rotation and
  # retention for EPGStation's logs are now handled centrally by the repo's logrotate
  # sidecar container (bind-mounts this logs/ dir), not by log4js. Leaving these active
  # would race with the sidecar copytruncating the same files.
  system:
    type: file
    # maxLogSize: 1048576
    # backups: 3
    filename: "%EPGUpdaterSystem%"
    pattern: "yyyy-MM-dd"
  access:
    type: file
    # maxLogSize: 1048576
    # backups: 3
    filename: "%EPGUpdaterAccess%"
    pattern: "yyyy-MM-dd"
  stream:
    type: file
    # maxLogSize: 1048576
    # backups: 3
    filename: "%EPGUpdaterStream%"
    pattern: "yyyy-MM-dd"
  encode:
    type: file
    # maxLogSize: 1048576
    # backups: 3
    filename: "%EPGUpdaterEncode%"
    pattern: "yyyy-MM-dd"
  console:
    type: console
  stdout:
    type: stdout
categories: 
  default: 
    appenders: 
      - console
      - stdout
    level: info
  system: 
    appenders: 
      - system
      - stdout
    level: info
  access: 
    appenders: 
      - access
      - stdout
    level: info
  stream: 
    appenders: 
      - stream
      - stdout
    level: info
